<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The site's "TMH." wordmark: heavy white letters and the amber dot on the page's dark background.
       Letters are drawn as shapes (not text) so the icon looks the same on every device. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c23"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(38 186) scale(.92)" fill="#eceef3">
    <!-- T -->
    <path d="M0 0H124V44H83V150H41V44H0Z"/>
    <!-- M -->
    <path d="M134 150V0H184L212 72L240 0H290V150H248V76L228 128H196L176 76V150Z"/>
    <!-- H -->
    <path d="M300 0H342V54H384V0H426V150H384V98H342V150H300Z"/>
    <!-- amber dot, as in the header -->
    <circle cx="453" cy="126" r="24" fill="#ffb547"/>
  </g>
</svg>
